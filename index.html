<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Athul Mamachan</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#111;
}

/* LAYOUT */
.container{
  display:grid;
  grid-template-columns:35% 65%;
  min-height:100vh;
}

.left{
  position:sticky;
  top:0;
  height:100vh;
  padding:60px 40px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.right{
  padding:60px;
}

/* REELS SECTION */
.reels-grid{
  margin-top:45px;
  display:grid;
  grid-template-columns:repeat(2, 363.2px); /* 2 cards per row */
  gap:20px;
  justify-content:flex-start;
}

.reel-card{
  width:363.2px;
  height:363.2px;
  border-radius:12px;
  overflow:hidden;
  border:2px solid #ddd;
}

.reel-card img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* MOBILE */
@media (max-width:900px){

.container{
  grid-template-columns:1fr;
}

.left{
  position:relative;
  height:auto;
}

.right{
  padding:40px 20px;
}

/* Keep 2 per row on mobile */
.reels-grid{
  grid-template-columns:repeat(2, 1fr);
  gap:10px;
}

.reel-card{
  width:100%;
  height:auto;
  aspect-ratio:1/1;
}

}

</style>
</head>

<body>

<div class="container">

<!-- LEFT -->
<aside class="left">
<h1>Athul Mamachan</h1>
<p>Video Editor</p>
</aside>

<!-- RIGHT -->
<main class="right">

<h2>Reels</h2>

<div class="reels-grid">

<a href="#" class="reel-card">
<img src="https://raw.githubusercontent.com/athulmamachan/portfolio/main/Source/Reel.jpeg">
</a>

<a href="#" class="reel-card">
<img src="https://raw.githubusercontent.com/athulmamachan/portfolio/main/Source/Course.jpeg">
</a>

<a href="#" class="reel-card">
<img src="https://raw.githubusercontent.com/athulmamachan/portfolio/main/Source/Merry%20boy.jpeg">
</a>

<a href="#" class="reel-card">
<img src="https://raw.githubusercontent.com/athulmamachan/portfolio/main/Source/Ads2.jpeg">
</a>

<a href="#" class="reel-card">
<img src="https://raw.githubusercontent.com/athulmamachan/portfolio/main/Source/Vespera.jpeg">
</a>

<a href="#" class="reel-card">
<img src="https://raw.githubusercontent.com/athulmamachan/portfolio/main/Source/Dress.jpeg">
</a>

</div>

</main>
</div>

</body>
</html>
